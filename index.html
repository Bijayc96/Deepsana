<!DOCTYPE html>
<html>
<head>
  <title>Deepsana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .top-bar {
      background: #111;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .header {
      background: white;
      text-align: center;
      padding: 25px;
    }

    .brand {
      font-size: 42px;
      letter-spacing: 12px;
      font-weight: bold;
    }

    .nav {
      margin-top: 25px;
    }

    .nav a {
      margin: 0 18px;
      text-decoration: none;
      color: #111;
      font-size: 14px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .tabs {
      text-align: center;
      margin: 50px 0 30px;
      font-size: 24px;
      letter-spacing: 8px;
    }

    .tabs span {
      margin: 0 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      padding: 0 45px 60px;
    }

    .product {
      background: white;
      text-align: center;
      padding-bottom: 20px;
    }

    .product img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      background: #ddd;
    }

    .product h3 {
      letter-spacing: 2px;
      font-size: 15px;
    }

    .product p {
      color: #555;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .brand {
        font-size: 32px;
        letter-spacing: 7px;
      }
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: 1fr;
      }

      .nav a {
        display: block;
        margin: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">FREE SHIPPING FOR US ORDERS OVER $100</div>

  <div class="header">
    <img src="IMG_7496%20(1).png" alt="DEEPSANA Logo" width="300">

    <div class="nav">
      <a href="#">FOR HIM</a>
      <a href="#">FOR HER</a>
      <a href="#">NEW DROP</a>
      <a href="#">LOOKBOOK</a>
    </div>
  </div>

  <div class="tabs">
    <span><u>FOR HIM</u></span>
    <span>FOR HER</span>
  </div>

  <div class="products">
    <div class="product">
      <img src="shirt1.jpg" alt="Product 1">
      <h3>DEEPSANA SHIRT</h3>
      <p>$39.99</p>
    </div>

    <div class="product">
      <img src="shirt2.jpg" alt="Product 2">
      <h3>DEEPSANA HOODIE</h3>
      <p>$59.99</p>
    </div>

    <div class="product">
      <img src="shirt3.jpg" alt="Product 3">
      <h3>CLASSIC OVERSHIRT</h3>
      <p>$44.99</p>
    </div>

    <div class="product">
      <img src="shirt4.jpg" alt="Product 4">
      <h3>RELAXED PANTS</h3>
      <p>$49.99</p>
    </div>
  </div>

</body>
</html>
